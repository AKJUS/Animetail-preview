name: Build job

permissions:
  contents: write

on:
  # Every day at 17:30 UTC
  schedule:
    - cron: '30 17 * * *'
  # Manual triggers
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git Ref (Optional)
        required: false
      dry-run:
        description: Creates a draft release
        required: false
        type: boolean

env:
  MIHON_GITHUB_RELEASE: true
  ANIMETAIL_GITHUB_RELEASE: true

jobs:
  check:
    name: Check for new commits
    runs-on: 'ubuntu-24.04'
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      commit-count: ${{ steps.check.outputs.commit-count }}
      current-sha: ${{ steps.check.outputs.current-sha }}
      prev-tag: ${{ steps.check.outputs.prev-tag }}
    steps:
      - name: Clone Repository (Latest)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: 'Animetailapp/Animetail'
          fetch-depth: 0
          filter: blob:none
        if: github.event.inputs.git-ref == ''
      - name: Clone Repository (Custom Ref)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: github.event.inputs.git-ref != ''
        with:
          repository: 'Animetailapp/Animetail'
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.event.inputs.git-ref }}

      - name: Compare against latest release
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          commit_count=$(git rev-list --count HEAD)
          echo "commit-count=$commit_count" >> $GITHUB_OUTPUT
          echo "current-sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

          tag_name=$(gh release list --repo Animetailapp/Animetail-preview --exclude-drafts --exclude-pre-releases --json tagName --limit 1 --jq 'select(length > 0) | .[0].tagName')
          if [ -n "$tag_name" ]; then
            echo "Latest Tag: $tag_name"
          else
            echo "No previous tag found, defaulting to r0"
            tag_name="r0"
          fi
          echo "prev-tag=$tag_name" >> $GITHUB_OUTPUT

          prev_commit_count=$(echo "$tag_name" | sed -e "s/^r//")
          if [ "$commit_count" -le "$prev_commit_count" ] && [ "${{ github.event_name }}" = 'schedule' ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No new commits since $tag_name, skipping build"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build app
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: 'ubuntu-24.04'
    env:
      COMMIT_COUNT: ${{ needs.check.outputs.commit-count }}
      CURRENT_SHA: ${{ needs.check.outputs.current-sha }}
      PREV_TAG: ${{ needs.check.outputs.prev-tag }}
    steps:
      - name: Clone Repository (Latest)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: 'Animetailapp/Animetail'
          fetch-depth: 0
        if: github.event.inputs.git-ref == ''
      - name: Clone Repository (Custom Ref)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: github.event.inputs.git-ref != ''
        with:
          repository: 'Animetailapp/Animetail'
          fetch-depth: 0
          ref: ${{ github.event.inputs.git-ref }}

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set ACRA properties
        env:
          acraUri: ${{ secrets.ACRA_URI }}
          acraLogin: ${{ secrets.ACRA_LOGIN }}
          acraPassword: ${{ secrets.ACRA_PASSWORD }}
        run: |
          echo "ACRA_URI=$acraUri" >> acra.properties
          echo "ACRA_LOGIN=$acraLogin" >> acra.properties
          echo "ACRA_PASSWORD=$acraPassword" >> acra.properties

      - name: Write client_secrets.json
        uses: DamianReeves/write-file-action@v1.2
        with:
          path: app/src/main/assets/client_secrets.json
          contents: ${{ secrets.CLIENT_SECRETS_TEXT }}
          write-mode: overwrite

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build APK
        run: ./gradlew assembleNightly -Pinclude-telemetry -Penable-updater

      - name: Sign APK
        uses: r0adkll/sign-android-release@a391126fec7ec364d9f6cf3ddc46aa1d8fa31502 # v1.0.4
        with:
          releaseDirectory: app/build/outputs/apk/nightly
          signingKeyBase64: ${{ secrets.DEBUG_KEYSTORE }}
          alias: androiddebugkey
          keyStorePassword: android
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload Proguard mapping file
        uses: actions/upload-artifact@v4
        with:
          name: mapping.txt
          path: app/build/outputs/mapping/standardNightly/mapping.txt

      - name: Prepare changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          prev_commit_count=$(echo "${{ env.PREV_TAG }}" | sed -e "s/^r//")
          commit_count_diff=$(expr ${{ env.COMMIT_COUNT }} - $prev_commit_count)
          if [ "$commit_count_diff" -gt 0 ]; then
            prev_release_sha=$(git rev-parse --short HEAD~$commit_count_diff)
          else
            prev_release_sha=$(git rev-parse --short HEAD~1)
          fi
          echo "PREV_RELEASE_SHA=$prev_release_sha" >> $GITHUB_ENV

          echo "COMMIT_LOGS<<{delimiter}
          $(curl -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/Animetailapp/Animetail/compare/$prev_release_sha...${{ env.CURRENT_SHA }}" \
            | jq '[.commits[]|{message:(.commit.message | split("\n")), username:.author.login}]' \
            | jq -r '.[]|"- \(.message | first) (@\(.username))"')
          {delimiter}" >> $GITHUB_ENV

      - name: Clean up build artifacts
        run: |
          set -e

          cp app/build/outputs/apk/nightly/app-universal-nightly-signed.apk animetail-r${{ env.COMMIT_COUNT }}.apk
          sha=`sha256sum animetail-r${{ env.COMMIT_COUNT }}.apk | awk '{ print $1 }'`
          echo "APK_UNIVERSAL_SHA=$sha" >> $GITHUB_ENV

          cp app/build/outputs/apk/nightly/app-arm64-v8a-nightly-signed.apk animetail-arm64-v8a-r${{ env.COMMIT_COUNT }}.apk
          sha=`sha256sum animetail-arm64-v8a-r${{ env.COMMIT_COUNT }}.apk | awk '{ print $1 }'`
          echo "APK_ARM64_V8A_SHA=$sha" >> $GITHUB_ENV

          cp app/build/outputs/apk/nightly/app-armeabi-v7a-nightly-signed.apk animetail-armeabi-v7a-r${{ env.COMMIT_COUNT }}.apk
          sha=`sha256sum animetail-armeabi-v7a-r${{ env.COMMIT_COUNT }}.apk | awk '{ print $1 }'`
          echo "APK_ARMEABI_V7A_SHA=$sha" >> $GITHUB_ENV

          cp app/build/outputs/apk/nightly/app-x86-nightly-signed.apk animetail-x86-r${{ env.COMMIT_COUNT }}.apk
          sha=`sha256sum animetail-x86-r${{ env.COMMIT_COUNT }}.apk | awk '{ print $1 }'`
          echo "APK_X86_SHA=$sha" >> $GITHUB_ENV

          cp app/build/outputs/apk/nightly/app-x86_64-nightly-signed.apk animetail-x86_64-r${{ env.COMMIT_COUNT }}.apk
          sha=`sha256sum animetail-x86_64-r${{ env.COMMIT_COUNT }}.apk | awk '{ print $1 }'`
          echo "APK_X86_64_SHA=$sha" >> $GITHUB_ENV

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: r${{ env.COMMIT_COUNT }}
          name: Animetail Nightly r${{ env.COMMIT_COUNT }}
          body: |
            ### Commits

            https://github.com/Animetailapp/Animetail/compare/${{ env.PREV_RELEASE_SHA }}...${{ env.CURRENT_SHA }}

            ${{ env.COMMIT_LOGS }}

            ---

            ### Checksums

            | Variant | SHA-256 |
            | ------- | ------- |
            | Universal | ${{ env.APK_UNIVERSAL_SHA }} |
            | arm64-v8a | ${{ env.APK_ARM64_V8A_SHA }} |
            | armeabi-v7a | ${{ env.APK_ARMEABI_V7A_SHA }} |
            | x86 | ${{ env.APK_X86_SHA }} |
            | x86_64 | ${{ env.APK_X86_64_SHA }} |

            <!-->
            > [!TIP]
            >
            > ### If you are unsure which version to download then go with `animetail-r${{ env.COMMIT_COUNT }}.apk`
          files: |
            animetail-r${{ env.COMMIT_COUNT }}.apk
            animetail-arm64-v8a-r${{ env.COMMIT_COUNT }}.apk
            animetail-armeabi-v7a-r${{ env.COMMIT_COUNT }}.apk
            animetail-x86-r${{ env.COMMIT_COUNT }}.apk
            animetail-x86_64-r${{ env.COMMIT_COUNT }}.apk
          draft: ${{ github.event.inputs.dry-run == 'true' || github.event.inputs.dry-run == true }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord
        if: ${{ !(github.event.inputs.dry-run == 'true' || github.event.inputs.dry-run == true) }}
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "content": "**🚀 ¡Nuevo release disponible!** <@&1196139193664028764>",
            "username": "Animetail Bot",
            "avatar_url": "https://github.com/Animetailapp/Animetailapp/blob/master/app/src/debug/res/mipmap-xxhdpi/ic_launcher.png?raw=true",
            "embeds": [{
              "title": "🚀 Nuevo Release - Animetail Nightly r${{ env.COMMIT_COUNT }}",
              "description": "🎉 **¡Se ha creado un nuevo release para Animetail!**\n\nPuedes revisar los commits recientes, descargar las APKs y verificar los checksums a continuación. 👇\n\n### 🛠️ **Checksums**\n\n| Variant    | SHA-256 |\n| ---------- | ----------------------------------------- |\n| Universal  | `${{ env.APK_UNIVERSAL_SHA }}`            |\n| arm64-v8a  | `${{ env.APK_ARM64_V8A_SHA }}`            |\n| armeabi-v7a| `${{ env.APK_ARMEABI_V7A_SHA }}`          |\n| x86        | `${{ env.APK_X86_SHA }}`                  |\n| x86_64     | `${{ env.APK_X86_64_SHA }}`               |",
              "url": "https://github.com/Animetailapp/Animetail-preview/releases/tag/r${{ env.COMMIT_COUNT }}",
              "color": 3066993,
              "thumbnail": {
                "url": "https://github.com/Animetailapp/Animetail2/blob/master/app/src/debug/res/mipmap-xxhdpi/ic_logo_monochrome.png?raw=true"
              },
              "fields": [
                {
                  "name": "📜 **Commits**",
                  "value": "[Ver commits recientes](https://github.com/Animetailapp/Animetail/compare/${{ env.PREV_RELEASE_SHA }}...${{ env.CURRENT_SHA }})",
                  "inline": false
                },
                {
                  "name": "📱 **Universal APK**",
                  "value": "[⬇️ Descargar Universal APK](https://github.com/Animetailapp/Animetail-preview/releases/download/r${{ env.COMMIT_COUNT }}/animetail-r${{ env.COMMIT_COUNT }}.apk)",
                  "inline": false
                },
                {
                  "name": "📲 **arm64-v8a APK**",
                  "value": "[⬇️ Descargar arm64-v8a APK](https://github.com/Animetailapp/Animetail-preview/releases/download/r${{ env.COMMIT_COUNT }}/animetail-arm64-v8a-r${{ env.COMMIT_COUNT }}.apk)",
                  "inline": false
                },
                {
                  "name": "📲 **armeabi-v7a APK**",
                  "value": "[⬇️ Descargar armeabi-v7a APK](https://github.com/Animetailapp/Animetail-preview/releases/download/r${{ env.COMMIT_COUNT }}/animetail-armeabi-v7a-r${{ env.COMMIT_COUNT }}.apk)",
                  "inline": false
                },
                {
                  "name": "📲 **x86 APK**",
                  "value": "[⬇️ Descargar x86 APK](https://github.com/Animetailapp/Animetail-preview/releases/download/r${{ env.COMMIT_COUNT }}/animetail-x86-r${{ env.COMMIT_COUNT }}.apk)",
                  "inline": false
                },
                {
                  "name": "📲 **x86_64 APK**",
                  "value": "[⬇️ Descargar x86_64 APK](https://github.com/Animetailapp/Animetail-preview/releases/download/r${{ env.COMMIT_COUNT }}/animetail-x86_64-r${{ env.COMMIT_COUNT }}.apk)",
                  "inline": false
                }
              ],
              "footer": {
                "text": "Release generado automáticamente por Animetail Bot",
                "icon_url": "https://github.com/Animetailapp/Animetail/blob/master/app/src/debug/res/mipmap-xxhdpi/ic_launcher.png?raw=true"
              },
              "timestamp": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"
            }]
          }' \
          ${{ secrets.DISCORD_WEBHOOK }}

      - name: Prune old releases
        uses: dev-drprasad/delete-older-releases@dfbe6be2a006e9475dfcbe5b8d201f1824c2a9fe # v0.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          keep_latest: 365
          delete_tags: true
